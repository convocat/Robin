# The ingestion pipeline: puts the customer handbook into Robin's content database
# (ingestion/ingest_handbook.py). Run it after every change to the handbook:
# Actions > "Ingest the handbook" > Run workflow.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   OPENAI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, DATABASE_URL
# DATABASE_URL is the database's External Database URL from the Render dashboard.
# Optionally the variable LANGFUSE_BASE_URL (default: the EU region, https://cloud.langfuse.com).
name: Ingest the handbook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      LANGFUSE_TRACING_ENVIRONMENT: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the secrets are there
        run: |
          for name in OPENAI_API_KEY LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY DATABASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::The repository secret $name is missing."; exit 1; fi
          done
      - run: pip install -r requirements.txt
      - name: Ingest the handbook
        run: python ingestion/ingest_handbook.py
